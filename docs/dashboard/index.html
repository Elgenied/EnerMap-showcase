<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EnerMap interactive dashboard</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.0/build/stlite.css">
<style>html,body,#root{margin:0;min-height:100vh}#loading{font:17px/1.6 Arial,sans-serif;color:#12354a;padding:36px;max-width:760px}a{color:#168b8d}</style></head>
<body><div id="root"><div id="loading"><h1>EnerMap interactive dashboard</h1><p>Loading the dashboard and saved Guildford results. The first visit may take a minute.</p><p><a href="../">Open the results summary</a></p></div></div>
<script type="module">
try {
const {mount}=await import('https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.0/build/stlite.js');
const response=await fetch('./mount-options.json');if(!response.ok)throw new Error('Could not load dashboard configuration');
const options=await response.json();window.enermap=mount(options,document.getElementById('root'));
}catch(error){document.getElementById('loading').append(document.createTextNode('Loading failed: '+error.message));}
</script></body></html>
